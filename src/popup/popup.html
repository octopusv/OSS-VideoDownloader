<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Vidulus</title>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M12 3v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Vidulus</span>
        <span class="brand-sub" id="countLabel">検出待機中</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="filterBtn" class="icon-btn" title="種別で絞り込み" aria-label="絞り込み">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </button>
      <button id="clearBtn" class="icon-btn" title="リストをクリア" aria-label="クリア">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="filter-bar" id="filterBar" hidden>
    <button class="chip active" data-filter="all">すべて</button>
    <button class="chip" data-filter="video">動画</button>
    <button class="chip" data-filter="audio">音声</button>
    <button class="chip" data-filter="hls">HLS</button>
    <button class="chip" data-filter="dash">DASH</button>
  </nav>

  <main id="list" class="list" role="list"></main>

  <section id="empty" class="empty" hidden>
    <div class="empty-art" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
      </svg>
    </div>
    <p class="empty-title">メディアが見つかりません</p>
    <p class="empty-desc">動画を再生するか、ページを操作すると<br>検出されたメディアがここに表示されます。</p>
  </section>

  <footer class="app-footer">
    <label class="fmt-select" title="HLS の保存形式（ダウンロード時に変換）">
      <span class="fmt-label">保存形式</span>
      <select id="formatSelect">
        <option value="mp4">MP4 · 動画（無劣化）</option>
        <option value="mkv">MKV · 動画（無劣化）</option>
        <option value="m4a">M4A · 音声のみ（無劣化）</option>
        <option value="mp3">MP3 · 音声のみ</option>
        <option value="ts">TS · 変換なし</option>
      </select>
    </label>
  </footer>

  <!-- アイテムのテンプレート -->
  <template id="itemTpl">
    <article class="card" role="listitem">
      <div class="thumb">
        <span class="kind-badge"></span>
      </div>
      <div class="meta">
        <div class="title"></div>
        <div class="subline"></div>
        <div class="progress" hidden>
          <div class="bar"><span></span></div>
          <span class="progress-text"></span>
        </div>
      </div>
      <div class="actions">
        <button class="dl-btn" title="ダウンロード">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="more-btn" title="その他">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <circle cx="12" cy="5" r="1.6" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
            <circle cx="12" cy="19" r="1.6" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </article>
  </template>

  <script src="popup.js" type="module"></script>
</body>
</html>
